<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AgriKaakian</title>
<style>
:root{--bg:#aee2ff;--tx:#390947;--pn:#fcef8d;--ac:#cc425e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f102a;--tx:#fcef8d;--pn:#4a3052;--ac:#cc425e}}
:root[data-theme="dark"]{--bg:#1f102a;--tx:#fcef8d;--pn:#4a3052;--ac:#cc425e}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:10px/1.7 "Press Start 2P",ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;padding:8px;min-height:100vh}
h1{font-size:12px;text-align:center;margin:4px 0}#wrap{position:relative;width:100%;max-width:672px}
canvas{width:100%;display:block;image-rendering:pixelated;border:4px solid #751756;border-radius:10px;background:#5ba675;touch-action:none}
.bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0;width:100%;max-width:672px}
button{font:inherit;background:var(--pn);color:var(--tx);border:2px solid #751756;border-radius:10px;padding:4px 8px;cursor:pointer;display:flex;align-items:center;gap:4px;min-height:44px}
button.on{background:var(--ac);color:#fff}button img{height:28px;image-rendering:pixelated}
#hud{display:flex;justify-content:space-between;width:100%;max-width:672px;font-weight:700;gap:8px;flex-wrap:wrap}
#msg{background:var(--pn);border:2px solid #751756;border-radius:10px;padding:6px 10px;width:100%;max-width:672px;min-height:44px}
#ctl{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:672px;margin:8px 0;touch-action:none;user-select:none}#joy{position:relative;width:132px;height:132px;border:3px solid #751756;border-radius:50%;background:var(--pn);touch-action:none}#knob{position:absolute;left:36px;top:36px;width:54px;height:54px;border-radius:50%;background:var(--ac);border:3px solid #751756}#ab{display:flex;gap:10px}#ab button{width:84px;height:84px;border-radius:50%;flex-direction:column;justify-content:center;font-size:9px;gap:6px}#ab .ic{width:28px;height:28px}@media (hover:hover) and (pointer:fine){#ctl{display:none}}.ic{width:16px;height:16px;shape-rendering:crispEdges;vertical-align:middle}
#ov{position:absolute;inset:0;background:#1f102a;color:#fcef8d;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:10px;gap:10px}#ov h2{margin:0;font-size:14px;line-height:1.5}#ov button{background:var(--ac);color:#fff;justify-content:center}
#ov:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px)}#logo{width:min(100%,360px);height:auto;image-rendering:pixelated;animation:bob 1s steps(2) infinite}@keyframes bob{50%{transform:translateY(-4px)}}#go{animation:blink 1s steps(2) infinite;z-index:1}@keyframes blink{50%{opacity:.4}}#mute{position:absolute;top:8px;right:8px;z-index:5;min-height:36px;padding:4px 6px}</style></head><body>

 const[fc,fr2]=front();if(playing&&fc>=0&&fr2>=0&&fc<W&&fr2<H){x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=2;x.strokeRect(fc*T+2,fr2*T+2,T-4,T-4)}

IC.spk=['...o....','..oo.o..','ooooo.o.','ooooo.o.','ooooo.o.','..oo.o..','...o....','........'];IC.mut=['...o....','..oo.o.o','ooooo.o.','ooooo.o.','ooooo.o.','..oo.o.o','...o....','........'];
let ac,mg,mb,sb,nb,P25,P50,muted=false,tm=null,cur=null,nt=0,si=0,trk=null,st2=0;
const NM={c:0,d:2,e:4,f:5,g:7,a:9,b:11},DR='k.h.s.hhk.h.s.h.';
const mi=s=>{const m=s.match(/^([a-g])(#?)(\d)$/);return m?(+m[3]+1)*12+NM[m[1]]+(m[2]?1:0):null},fq=m=>440*Math.pow(2,(m-69)/12);
function parse(s){const o=[];s.split(' ').forEach(t=>{const[n,l]=t.split(':'),L=+l;o.push({m:n=='r'?null:mi(n),l:L});for(let i=1;i<L;i++)o.push(0)});return o}
const TR={farm:{bpm:132,lead:'e5:2 g5:2 c6:4 g5:2 e5:2 g5:4 d5:2 f5:2 a5:4 f5:2 d5:2 f5:4 e5:2 g5:2 c6:4 b5:2 g5:2 e5:4 d5:4 g5:4 f5:2 e5:2 d5:4 c5:2 e5:2 g5:4 e5:2 c5:2 e5:4 a4:2 c5:2 f5:4 c5:2 a4:2 c5:4 g4:2 b4:2 d5:4 g5:2 f5:2 e5:2 d5:2 c5:8 r:2 g4:2 c5:4',bass:['c3 g3','d3 a3','c3 g3','g2 d3','c3 g3','f2 c3','g2 d3','c3 g3'],ch:[['c4','e4','g4'],['d4','f4','a4'],['c4','e4','g4'],['g3','b3','d4'],['c4','e4','g4'],['f3','a3','c4'],['g3','b3','d4'],['c4','e4','g4']]},
title:{bpm:116,lead:'g4:4 c5:4 e5:4 g5:4 a5:6 g5:2 e5:4 c5:4 f5:4 a5:4 c6:4 a5:4 g5:8 d5:4 g4:4',bass:['c3 g3','a2 e3','f2 c3','g2 d3'],ch:[['c4','e4','g4'],['a3','c4','e4'],['f3','a3','c4'],['g3','b3','d4']]}};
function build(t){const bars=t.bass.length;t.n=bars*16;t.L=parse(t.lead);t.B=[];t.A=[];t.s=60/t.bpm/4;for(let b=0;b<bars;b++){const[r,f]=t.bass[b].split(' ');for(let i=0;i<16;i++){t.B[b*16+i]=i%4==0?mi(i<8?r:f):null;t.A[b*16+i]=mi(t.ch[b][[0,1,2,1][i%4]])}}}
function initA(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
mg=ac.createGain();mg.gain.value=muted?0:.5;mg.connect(ac.destination);mb=ac.createGain();mb.gain.value=.55;mb.connect(mg);sb=ac.createGain();sb.gain.value=.9;sb.connect(mg);
nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const mk=u=>{const re=new Float32Array(65),im=new Float32Array(65);for(let n=1;n<65;n++)im[n]=2/(n*Math.PI)*(1-Math.cos(2*Math.PI*n*u));return ac.createPeriodicWave(re,im)};P25=mk(.25);P50=mk(.5)}
function sq(f,w,d,v,wave,vib){const o=ac.createOscillator(),g=ac.createGain();o.setPeriodicWave(wave);o.frequency.value=f;g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(v,w+.01);g.gain.setValueAtTime(v*.7,w+Math.min(.08,d*.5));g.gain.linearRampToValueAtTime(0,w+d);
if(vib){const lf=ac.createOscillator(),lg=ac.createGain();lf.frequency.value=5.5;lg.gain.value=f*.012;lf.connect(lg);lg.connect(o.frequency);lf.start(w+.1);lf.stop(w+d+.02)}
o.connect(g);g.connect(mb);o.start(w);o.stop(w+d+.02)}
function fm(f,w){const c=ac.createOscillator(),m=ac.createOscillator(),mm=ac.createGain(),g=ac.createGain();c.frequency.value=f;m.frequency.value=f*2;mm.gain.setValueAtTime(f*3,w);mm.gain.exponentialRampToValueAtTime(1,w+.18);m.connect(mm);mm.connect(c.frequency);g.gain.setValueAtTime(.34,w);g.gain.exponentialRampToValueAtTime(.001,w+.3);c.connect(g);g.connect(mb);[c,m].forEach(o=>{o.start(w);o.stop(w+.32)})}
function tn(type,f0,f1,d,v,w,out){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,w);o.frequency.exponentialRampToValueAtTime(f1,w+d);g.gain.setValueAtTime(v,w);g.gain.exponentialRampToValueAtTime(.001,w+d);o.connect(g);g.connect(out||sb);o.start(w);o.stop(w+d+.02)}

function note(t,i,w){const l=t.L[i];if(l&&l.m!=null)sq(fq(l.m),w,l.l*t.s*.95,.15,P25,l.l>=4);

sell:()=>{tn('square',988,988,.07,.18,w);tn('square',1319,1319,.3,.18,w+.07)},sleep:()=>ar([523,440,349,262],'triangle',.2,.35),morn:()=>ar([523,659,784,1047],'square',.08,.16),
no:()=>tn('sawtooth',200,90,.18,.18,w),step:()=>nz(w,.04,.1,'lowpass',900+Math.random()*500,sb),start:()=>ar([262,330,392,523,659,784,1047],'square',.07,.18),win:()=>ar([523,659,784,1047,784,1047,1319,1568],'square',.11,.2)};
if(S[n])S[n]()}
