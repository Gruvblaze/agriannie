<!DOCTYPE html><html lang="bcl"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AgriKaakian</title>
<style>
:root{--bg:#aee2ff;--tx:#390947;--pn:#fcef8d;--ac:#cc425e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f102a;--tx:#fcef8d;--pn:#4a3052;--ac:#cc425e}}
:root[data-theme="dark"]{--bg:#1f102a;--tx:#fcef8d;--pn:#4a3052;--ac:#cc425e}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:10px/1.7 "Press Start 2P",ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;padding:8px;min-height:100vh}
h1{font-size:12px;text-align:center;margin:4px 0}#wrap{position:relative;width:100%;max-width:672px}
canvas{width:100%;display:block;image-rendering:pixelated;border:4px solid #751756;border-radius:10px;background:#5ba675;touch-action:none}
.bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0;width:100%;max-width:672px}
button{font:inherit;background:var(--pn);color:var(--tx);border:2px solid #751756;border-radius:10px;padding:4px 8px;cursor:pointer;display:flex;align-items:center;gap:4px;min-height:44px}
button.on{background:var(--ac);color:#fff}button img{height:28px;image-rendering:pixelated}
#hud{display:flex;justify-content:space-between;width:100%;max-width:672px;font-weight:700;gap:8px;flex-wrap:wrap}
#msg{background:var(--pn);border:2px solid #751756;border-radius:10px;padding:6px 10px;width:100%;max-width:672px;min-height:44px}
#ctl{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:672px;margin:8px 0;touch-action:none;user-select:none}#joy{position:relative;width:132px;height:132px;border:3px solid #751756;border-radius:50%;background:var(--pn);touch-action:none}#knob{position:absolute;left:36px;top:36px;width:54px;height:54px;border-radius:50%;background:var(--ac);border:3px solid #751756}#ab{display:flex;gap:10px}#ab button{width:84px;height:84px;border-radius:50%;flex-direction:column;justify-content:center;font-size:9px;gap:6px}#ab .ic{width:28px;height:28px}@media (hover:hover) and (pointer:fine){#ctl{display:none}}.ic{width:16px;height:16px;shape-rendering:crispEdges;vertical-align:middle}
#ov{position:absolute;inset:0;background:#1f102a;color:#fcef8d;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:10px;gap:10px}#ov h2{margin:0;font-size:14px;line-height:1.5}#ov button{background:var(--ac);color:#fff;justify-content:center}
#ov:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px)}#logo{width:min(100%,360px);height:auto;image-rendering:pixelated;animation:bob 1s steps(2) infinite}@keyframes bob{50%{transform:translateY(-4px)}}#go{animation:blink 1s steps(2) infinite;z-index:1}@keyframes blink{50%{opacity:.4}}#mute{position:absolute;top:8px;right:8px;z-index:5;min-height:36px;padding:4px 6px}#cbtn{position:absolute;top:8px;right:56px;z-index:5;min-height:36px;padding:4px 6px}#cbtn{right:auto;left:56px}#mute{right:auto;left:8px}#day,#clk,#coin,#wx{display:none}
#cal{position:fixed;inset:0;z-index:60;display:none;background:rgba(31,16,42,.86);padding:calc(env(safe-area-inset-top,0px) + 68px) 12px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:auto;font-size:8px;line-height:1.7}
.book{position:relative;margin:auto;width:100%;max-width:760px;background:#f7e0a0;color:#611851;border-radius:6px;box-shadow:0 0 0 3px #f2ae99,0 0 0 6px #c97373,0 0 0 9px #611851,0 10px 0 9px #390947;padding:22px 4px 10px}
.bnr{position:absolute;left:50%;top:-52px;transform:translateX(-50%);text-align:center;z-index:3;pointer-events:none}
.bnr b{display:block;font-size:30px;line-height:1.1;color:#fff;text-shadow:3px 0 #cc425e,-3px 0 #cc425e,0 3px #cc425e,0 -3px #cc425e,3px 3px #cc425e,-3px -3px #cc425e,3px -3px #cc425e,-3px 3px #cc425e,0 6px #751756}
.bnr span{display:inline-block;margin-top:6px;background:#fff;color:#cc425e;border:3px solid #cc425e;padding:4px 10px;font-size:9px}
.book .bxb{position:absolute;top:-16px;right:-12px;width:36px;height:36px;min-height:36px;padding:0;justify-content:center;background:#cc425e;border:3px solid #fff;border-radius:4px;z-index:4}.bxb .ic{width:18px;height:18px}
.pgs{display:flex}.pg{flex:1;min-width:0;padding:8px 14px 14px;display:flex;flex-direction:column;gap:10px}
.spn{display:none;width:22px;flex:none;position:relative;background:#611851;margin:-22px 0 -10px}
.spn:before{content:"";position:absolute;left:-9px;right:-9px;top:6px;bottom:6px;background:repeating-linear-gradient(0deg,#390947 0 9px,transparent 9px 26px);border-radius:3px}
.ph{display:flex;align-items:center;justify-content:center;gap:10px;height:42px;color:#c97373;font-size:15px;text-shadow:2px 2px 0 #fcef8d;border-bottom:2px solid rgba(117,23,86,.2);padding-top:14px}
.ph .ic{width:24px;height:24px;flex:none}.ph .ic:last-child{transform:scaleX(-1)}.ph.ps .ic:last-child{transform:none}
.book .nv{width:30px;height:30px;min-height:30px;padding:0;justify-content:center;background:#f2ae99;border:2px solid #c97373;border-radius:4px;flex:none}.nv:disabled{opacity:.3;cursor:default}.nv .ic{width:16px;height:16px}
.cds{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding-top:10px}
.cd{position:relative;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),#aee2ff;border:2px solid #8db7ff;border-radius:3px;padding:12px 2px 6px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;box-shadow:0 2px 0 #8db7ff}
.cd .rg{position:absolute;left:4px;right:4px;top:-4px;height:6px;background:repeating-linear-gradient(90deg,#6d80fa 0 3px,transparent 3px 8px)}
.cd .ic{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:22px;height:22px;filter:drop-shadow(1px 0 #751756) drop-shadow(-1px 0 #751756) drop-shadow(0 1px #751756) drop-shadow(0 -1px #751756)}
.cd img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated;margin:8px 0 4px}.cd.st0 img{filter:brightness(0);opacity:.28}
.cd .q{position:absolute;left:5px;top:14px;color:#6d80fa;font-size:10px}.cd.lk{cursor:default;opacity:.75}.cd.lk .q{position:static;font-size:18px;margin:auto}
.cd .ct{font-size:8px}.ct.r{color:#cc425e}.ct.b{color:#6d80fa}.cd.sel{outline:3px solid #cc425e;outline-offset:1px}
.lb{text-align:center;font-size:9px;color:#751756;border-bottom:2px solid rgba(117,23,86,.3);padding-bottom:5px}.dt{margin:0;text-align:center;min-height:3.4em}
.bx2{background:#f2ae99;border:2px solid #c97373;border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:6px}
.bh{background:rgba(255,255,255,.45);padding:3px 6px;color:#a32858}
.en{display:flex;gap:8px;align-items:center}.en .ic{width:20px;height:20px;flex:none}.en span{display:flex;flex-direction:column;gap:2px;line-height:1.5}.en u{text-decoration:none;color:#a32858}.em{opacity:.85}
.cgd{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-top:6px}
.cl{position:relative;min-height:58px;background:rgba(252,239,141,.6);border:2px solid rgba(117,23,86,.22);border-radius:4px;display:flex;align-items:flex-end;justify-content:flex-end;padding:4px;font-size:9px}
.cl.pa{background:#cc425e;border-color:#a32858;color:#fff}.cl.td{background:#fcef8d;outline:3px solid #6d80fa;color:#611851}
.cl .sr{position:absolute;left:2px;top:2px;display:flex;flex-direction:column}.cl .sr .ic{width:12px;height:12px}
.cl u{position:absolute;right:3px;top:3px;width:8px;height:8px;background:#6d80fa;border:1px solid #fff}.cl u.w2{background:#4e187c}
.eb{flex-direction:row;gap:8px;align-items:flex-start}.eb i{width:30px;height:30px;flex:none;border:2px solid #611851;position:relative}.eb i:after{content:"";position:absolute;left:6px;top:6px;width:6px;height:6px;background:#fff}.eb p{margin:0}.eb b{display:block;color:#a32858;margin-bottom:2px}
.lgs{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}.lg{display:flex;align-items:center;gap:6px}.lg .ic{width:14px;height:14px;flex:none}.lg i{width:10px;height:10px;flex:none;border:1px solid #611851}
.tz{margin:0;opacity:.7;text-align:center}
.tbs{display:flex;gap:6px;padding:6px 10px 0}.book .tbs button{flex:1;justify-content:center;min-height:38px;background:#c97373;border:2px solid #611851;border-radius:4px;color:#fff;font-size:8px}.book .tbs button.on{background:#f2ae99;color:#611851}
@media (max-width:719px){.book[data-pg=L] #pR,.book[data-pg=R] #pL{display:none}.pgs{padding-top:20px}}
@media (min-width:720px){.spn{display:block}.tbs{display:none}.pg{padding:8px 18px 16px}}

const FP=[[62, 150, 111, 196], [192, 138, 246, 164], [62, 523, 89, 557], [172, 461, 194, 488], [224, 445, 248, 461], [62, 675, 108, 718], [202, 674, 248, 717], [66, 864, 108, 908], [450, 119, 494, 154], [500, 118, 540, 152], [548, 119, 638, 150], [644, 124, 698, 150], [457, 346, 511, 372], [634, 342, 680, 385], [522, 493, 635, 546], [402, 721, 465, 738], [478, 717, 514, 739], [634, 719, 680, 762], [547, 832, 593, 844], [522, 898, 615, 916]];

function inOK(fx,fy){for(const d of[-10,0,10]){const sx=(fx+d)/IS,sy=fy/IS;if(!WK.some(r=>inR([sx,sy],r)))return false;for(const r of FP)if(inR([sx,sy],r))return false}return true}
function inFree(nx,ny){return inOK(nx+22,ny+50)}
function nearBed(){const f=[(px+22)/IS,(py+50)/IS];return BEDS.some(b=>inR(f,b))}
function dbg(cam,yo){if(!DBG)return;if(scene=='out'){x.fillStyle='rgba(234,98,98,.35)';for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(solid(c,r)){const X=c*T-CAMX,Y=r*T-CAMY;if(X>-T&&X<672&&Y>-T&&Y<480)x.fillRect(X,Y,T,T)}x.fillStyle='rgba(107,201,108,.6)';x.fillRect(MP.door.c0*T-CAMX,MP.door.r*T-CAMY,(MP.door.c1-MP.door.c0+1)*T,T);x.fillStyle='#fff';x.fillRect(px+20-CAMX,py+48-CAMY,4,4)}else{x.fillStyle='rgba(234,98,98,.35)';FP.forEach(r=>x.fillRect(r[0]*IS-cam,r[1]*IS+yo,(r[2]-r[0])*IS,(r[3]-r[1])*IS));x.fillStyle='rgba(107,201,108,.5)';x.fillRect(MAT[0]*IS-cam,MAT[1]*IS+yo,(MAT[2]-MAT[0])*IS,(MAT[3]-MAT[1])*IS);x.fillStyle='#fff';x.fillRect(px+20-cam,py+48+yo,4,4)}}
function drawIn(){x.fillStyle='#1f102a';x.fillRect(0,0,672,480);const cam=Math.max(0,Math.min(RW-672,px+22-336)),yo=-Math.max(0,Math.min(RH-480,py+30-240));x.drawImage(A.room,-cam,yo,RW,RH);const a=A['a'+dir+fr];x.drawImage(a,Math.round(px-2-cam),Math.round(py-6+yo),48,57);dbg(cam,yo);post()}
